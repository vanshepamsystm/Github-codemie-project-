<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Half-Baked Todo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="todo-app">
    <p class="eyebrow">A tiny work in progress</p>
    <h1>Things to do<span>.</span></h1>

    <form id="todo-form">
      <label class="sr-only" for="todo-input">New todo</label>
      <input id="todo-input" name="title" placeholder="Add a thing..." maxlength="160" required>
      <button type="submit">Add</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="todo-list" aria-live="polite"></ul>

    <p class="footnote">Not fancy. Gets the list done.</p>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
